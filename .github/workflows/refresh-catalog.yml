name: Refresh public catalogue previews
on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-catalogue-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --experimental-strip-types scripts/refresh-catalog.mjs
        env:
          DOMAINRADAR_URL: ${{ secrets.DOMAINRADAR_URL }}
          DOMAINRADAR_REFRESH_TOKEN: ${{ secrets.DOMAINRADAR_REFRESH_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
