<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ScopeFlux — mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap');
body { margin: 0; }
a { color: #FF7A91; }
input::placeholder { color: #6F6880; }
</style>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; position: relative; background: #15121A; color: #F2EDF7; font-family: Figtree, system-ui, sans-serif">

  <!-- top bar -->
  <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #241F2D">
    <button type="button" onClick="{{openDrawer}}" aria-label="Open navigation" style="background: transparent; border: 1px solid #2E2838; border-radius: 10px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
      <svg viewBox="0 0 20 20" aria-hidden="true" style="width: 18px; height: 18px; display: block"><path d="M3 6h14M3 10h14M3 14h14" fill="none" stroke="#F2EDF7" stroke-width="1.8" stroke-linecap="round"></path></svg>
    </button>
    <span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 7px; background: radial-gradient(70% 70% at 30% 25%, #FF9A4D 0%, #FF2E63 62%, #C41744 100%); display: block"></span>
    <span style="font-family: 'Bricolage Grotesque', Figtree, sans-serif; font-weight: 800; font-size: 17px; letter-spacing: -.02em">ScopeFlux</span>
  </div>

  <div style="padding: 16px 14px; display: flex; flex-direction: column; gap: 14px">
    <div>
      <label for="mq" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Search a topic</label>
      <div style="display: flex; gap: 6px; background: #1C1824; border: 1px solid #2E2838; border-radius: 12px; padding: 4px 4px 4px 13px">
        <input id="mq" type="search" placeholder="Search any topic" style="flex: 999 1 100px; min-width: 0; background: transparent; border: 0; outline: none; color: #F2EDF7; font-family: inherit; font-size: 16px; padding: 9px 0">
        <a href="Result.dc.html" style="display: flex; align-items: center; background: #332C40; color: #F2EDF7; border-radius: 9px; padding: 0 14px; font-size: 14px; font-weight: 600; min-height: 44px; text-decoration: none">Scan</a>
      </div>
    </div>

    <h1 style="margin: 4px 0 0 0; font-family: 'Bricolage Grotesque', Figtree, sans-serif; font-weight: 800; font-size: 26px; letter-spacing: -.03em">Discover trends</h1>

    <div style="display: flex; gap: 4px; border-bottom: 1px solid #241F2D">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
        <button type="button" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>

    <div style="display: flex; gap: 8px; overflow-x: auto">
      <span style="flex: 0 0 auto; background: #2A2435; border-radius: 8px; padding: 9px 12px; font-size: 13px; font-weight: 600">Worldwide</span>
      <span style="flex: 0 0 auto; background: #2A2435; border-radius: 8px; padding: 9px 12px; font-size: 13px; font-weight: 600">7 days</span>
    </div>

    <div style="display: flex; flex-direction: column">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <a href="Result.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid #221D2B; text-decoration: none; color: inherit; min-height: 44px">
          <div style="flex: 999 1 auto; min-width: 0">
            <p style="margin: 0 0 5px 0; font-size: 15px; font-weight: 600">{{r.title}}</p>
            <div style="display: flex; align-items: center; gap: 4px">
              <sc-for list="{{r.dots}}" as="d" hint-placeholder-count="5"><span aria-hidden="true" style="{{d}}"></span></sc-for>
              <span style="font-size: 12px; color: #8C85A0; margin-left: 5px">{{r.meta}}</span>
            </div>
          </div>
          <span style="flex: 0 0 auto; font-size: 15px; font-weight: 700; color: #FFB3C3">{{r.delta}}</span>
        </a>
      </sc-for>
    </div>
  </div>

  <!-- drawer -->
  <sc-if value="{{drawerOpen}}" hint-placeholder-val="{{false}}">
    <div onClick="{{closeDrawer}}" style="position: absolute; inset: 0; background: rgba(10,8,14,.7); z-index: 20"></div>
    <div style="position: absolute; top: 0; bottom: 0; left: 0; width: 280px; background: #19151F; border-right: 1px solid #241F2D; z-index: 21; padding: 14px; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box">
      <div style="display: flex; align-items: center; gap: 9px">
        <span style="font-family: 'Bricolage Grotesque', Figtree, sans-serif; font-weight: 800; font-size: 17px; margin-right: auto">ScopeFlux</span>
        <button type="button" onClick="{{closeDrawer}}" aria-label="Close navigation" style="background: transparent; border: 1px solid #2E2838; border-radius: 10px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
          <svg viewBox="0 0 14 14" aria-hidden="true" style="width: 12px; height: 12px; display: block"><path d="M3 3l8 8M11 3l-8 8" fill="none" stroke="#F2EDF7" stroke-width="1.7" stroke-linecap="round"></path></svg>
        </button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <sc-for list="{{navMain}}" as="n" hint-placeholder-count="4">
          <a href="{{n.href}}" style="{{n.style}}"><span style="{{n.mark}}"></span><span>{{n.label}}</span></a>
        </sc-for>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px; border-top: 1px solid #241F2D; padding-top: 16px">
        <sc-for list="{{navWork}}" as="n" hint-placeholder-count="4">
          <a href="{{n.href}}" style="{{n.style}}"><span style="{{n.mark}}"></span><span>{{n.label}}</span></a>
        </sc-for>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { drawer: false, tab: 'rising' }; }

  renderVals() {
    const s = this.state;
    const link = (key, label, href) => {
      const on = key === 'discover';
      return {
        label, href,
        style: 'display: flex; align-items: center; gap: 10px; text-decoration: none; border-radius: 10px; padding: 0 10px; min-height: 44px; font-size: 15px; font-weight: ' + (on ? '600' : '500') +
               '; color: ' + (on ? '#F2EDF7' : '#A79FB4') + '; background: ' + (on ? '#241E2E' : 'transparent'),
        mark: 'width: 3px; height: 16px; border-radius: 2px; flex: 0 0 auto; background: ' + (on ? 'linear-gradient(180deg, #FF9A4D 0%, #FF2E63 100%)' : 'transparent')
      };
    };
    const navMain = [link('discover', 'Discover trends', 'Main.dc.html'), link('csv', 'CSV analytics', 'Import.dc.html'), link('compare', 'Compare topics', 'Compare.dc.html'), link('season', 'Seasonality', 'Seasonality.dc.html')];
    const navWork = [link('saved', 'Saved topics', 'Saved.dc.html'), link('import', 'Import data', 'Import.dc.html'), link('sources', 'Sources & help', 'Sources.dc.html'), link('states', 'Status & errors', 'States.dc.html')];

    const colors = ['#FF2E63', '#FF9A4D', '#FFD166', '#A78BFA', '#7E7691'];
    const dots = (n) => colors.map((c, i) => 'width: 7px; height: 7px; border-radius: 50%; display: block; flex: 0 0 auto; background: ' + (i < n ? c : '#2E2838'));

    const rising = [
      { title: 'Framework Laptop 16', n: 4, meta: 'led by Reddit', delta: '+52%' },
      { title: 'Godot 5', n: 3, meta: 'led by Hacker News', delta: '+41%' },
      { title: 'Daylight saving time', n: 3, meta: 'led by GDELT', delta: '+33%' },
      { title: 'Bambu Lab H2D', n: 3, meta: 'led by Reddit', delta: '+28%' },
      { title: 'Winter Olympics 2026', n: 2, meta: 'led by GDELT', delta: '+24%' },
      { title: 'Krita 6', n: 2, meta: 'led by Reddit', delta: '+19%' }
    ];
    const early = [
      { title: 'Steam Frame headset', n: 1, meta: 'Reddit only, 1 day', delta: '+140%' },
      { title: 'Ladybird browser alpha', n: 1, meta: 'Hacker News only, 3 days', delta: '+88%' },
      { title: 'Prusa Core One L', n: 1, meta: 'Reddit only, 2 days', delta: '+64%' }
    ];
    const list = s.tab === 'rising' ? rising : early;
    const rows = list.map((r) => ({ title: r.title, meta: r.meta, delta: r.delta, dots: dots(r.n) }));

    const tabStyle = (on) => 'flex: 1 1 0; background: transparent; border: 0; border-bottom: 2px solid ' + (on ? '#FF2E63' : 'transparent') +
      '; color: ' + (on ? '#F2EDF7' : '#A79FB4') + '; font-family: inherit; font-size: 14px; font-weight: ' + (on ? '600' : '500') + '; min-height: 44px; margin-bottom: -1px; cursor: pointer';
    const tabs = [{ k: 'rising', l: 'Rising now' }, { k: 'early', l: 'Early signals' }].map((t) => ({ label: t.l, style: tabStyle(s.tab === t.k), pick: () => this.setState({ tab: t.k }) }));

    return {
      navMain, navWork, rows, tabs,
      drawerOpen: s.drawer,
      openDrawer: () => this.setState({ drawer: true }),
      closeDrawer: () => this.setState({ drawer: false })
    };
  }
}
</script>
</body>
</html>
